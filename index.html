<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MX Notes Notepad</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="notepad-window">
        <header class="crumb-bar">
          <span>Home</span>
          <span class="sep">&gt;</span>
          <span>Tools</span>
          <span class="sep">&gt;</span>
          <span class="current">Notepad</span>
        </header>

        <nav class="menu-bar" aria-label="Menu">
          <button>File</button>
          <button>Edit</button>
          <button>View</button>
          <button>Help</button>
        </nav>

        <div class="toolbar" aria-label="Toolbar">
          <button class="tool-btn" aria-label="New document">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L18 7v13.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Zm7 1.8v3.2h3.2"/></svg>
          </button>
          <button class="tool-btn" aria-label="Open file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4.3l1.3 2h7.4A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/></svg>
          </button>
          <button class="tool-btn" aria-label="Save">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5L18.5 7v12.5a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Zm2 0v5h8v-5M8 16h8v3H8v-3Z"/></svg>
          </button>
          <button class="tool-btn" aria-label="Print">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7V3.5h10V7M6 9.5h12a2 2 0 0 1 2 2v4.5H16v3H8v-3H4V11.5a2 2 0 0 1 2-2Zm2 7.5h8v-3H8v3Z"/></svg>
          </button>
          <button class="tool-btn" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8H3v5h5v-2H7.8A6.2 6.2 0 1 1 18.2 14H16a4.2 4.2 0 1 0-7.5-2.8H8V8Z"/></svg>
          </button>
          <button class="tool-btn" aria-label="Redo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8h5v5h-5v-2h.2A6.2 6.2 0 1 0 5.8 14H8a4.2 4.2 0 1 1 7.5-2.8H16V8Z"/></svg>
          </button>
          <button class="tool-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4.5a6 6 0 1 1 0 12a6 6 0 0 1 0-12Zm8.5 18l-5.4-5.4"/></svg>
          </button>
          <button class="tool-btn add-btn" aria-label="Add item">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <div class="editor-shell">
          <textarea id="notepad" rows="24" spellcheck="false" aria-label="Notebook"></textarea>
        </div>

        <footer class="status-bar">
          <span id="statusText">Line 1, Column 1</span>
        </footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
